<style>
/* Layout: 한 줄짜리 원장(ledger). 왼쪽 칸은 지금 정렬 기준(올라온 시각 또는 D-day)을 크게 보여 준다. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --ink: #141a22;
  --muted: #5d6876;
  --line: #dde2e8;
  --accent: #0c6b5e;
  --accent-soft: #e2f1ee;
  --urgent: #b4321f;
  --urgent-soft: #fbe9e5;
  --warn: #8a5a00;
  --warn-soft: #fbf0d9;
  --c-vc: #1f7a3d;  --c-vc-bg: #e3f3e8;
  --c-pe: #5b3fa8;  --c-pe-bg: #ece7f8;
  --c-ib: #1d5fae;  --c-ib-bg: #e3edf9;
  --c-am: #a35310;  --c-am-bg: #f8ebdd;
  --c-sec: #7a6a00; --c-sec-bg: #f5f0d2;
  --c-adv: #0e6a78; --c-adv-bg: #ddf1f4;
  --c-acct: #a12d5c; --c-acct-bg: #f8e4ec;
  --c-etc: #55606d; --c-etc-bg: #eceff2;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419; --surface: #161d25; --ink: #e6ebf0; --muted: #94a0ad; --line: #26303b;
    --accent: #4cc3ad; --accent-soft: #123a34;
    --urgent: #ff8a73; --urgent-soft: #3d1c16; --warn: #e8b85c; --warn-soft: #3a2c10;
    --c-vc: #7fd59a; --c-vc-bg: #16301f; --c-pe: #b9a5f2; --c-pe-bg: #2a2244;
    --c-ib: #8fbcf2; --c-ib-bg: #172a42; --c-am: #f0ad6e; --c-am-bg: #3a2614;
    --c-sec: #e0cf6a; --c-sec-bg: #33300f; --c-etc: #a9b3bf; --c-etc-bg: #222a33;
    --c-adv: #6fd3e0; --c-adv-bg: #12333a; --c-acct: #f29bbd; --c-acct-bg: #3b1828;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419; --surface: #161d25; --ink: #e6ebf0; --muted: #94a0ad; --line: #26303b;
  --accent: #4cc3ad; --accent-soft: #123a34;
  --urgent: #ff8a73; --urgent-soft: #3d1c16; --warn: #e8b85c; --warn-soft: #3a2c10;
  --c-vc: #7fd59a; --c-vc-bg: #16301f; --c-pe: #b9a5f2; --c-pe-bg: #2a2244;
  --c-ib: #8fbcf2; --c-ib-bg: #172a42; --c-am: #f0ad6e; --c-am-bg: #3a2614;
  --c-sec: #e0cf6a; --c-sec-bg: #33300f; --c-etc: #a9b3bf; --c-etc-bg: #222a33;
  --c-adv: #6fd3e0; --c-adv-bg: #12333a; --c-acct: #f29bbd; --c-acct-bg: #3b1828;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
[hidden] { display: none !important; }
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: flex; flex-direction: column; gap: 20px;
}
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.asof { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.asof b { color: var(--ink); font-weight: 600; }
.stale { font-size: 11px; color: var(--warn); background: var(--warn-soft); padding: 2px 8px; border-radius: 99px; font-weight: 600; }

/* 요약 띠 */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.summary button { all: unset; cursor: pointer; padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--line); }
.summary button:first-child { border-left: 0; }
.summary button:hover { background: var(--bg); }
.summary button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.summary button[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--accent); }
.summary .k { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.summary .v { font-family: var(--f-mono); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.summary .v.urgent { color: var(--urgent); }
.summary .v.accent { color: var(--accent); }

/* 정렬 탭 */
.tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 3px; gap: 3px; }
.tabs button { all: unset; cursor: pointer; font-size: 14px; font-weight: 600; padding: 7px 16px; border-radius: 6px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tabbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.count { font-size: 13px; color: var(--muted); }

/* 필터 */
.filters { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .lab { font-size: 12px; color: var(--muted); width: 44px; flex: none; letter-spacing: 0.04em; }
.chip { all: unset; cursor: pointer; font-size: 13px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; }
.chip:hover { border-color: var(--muted); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .n { font-family: var(--f-mono); font-size: 11px; opacity: 0.7; margin-left: 4px; }
.search { flex: 1 1 220px; min-width: 0; font: inherit; font-size: 14px; padding: 7px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
label.tog { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
label.tog input { accent-color: var(--accent); }

/* 목록 */
.day { display: flex; flex-direction: column; }
.day + .day { margin-top: 18px; }
.day h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; letter-spacing: 0.02em; }
.day h2 .d { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
.day.fresh h2 .d { color: var(--accent); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.day.fresh .list { border-color: var(--accent); }
.item { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 4px 16px; padding: 14px 18px; border-top: 1px solid var(--line); align-items: start; }
.item:first-child { border-top: 0; }
.item.closed { opacity: 0.55; }
.key { font-size: 13px; font-weight: 600; text-align: center; padding: 4px 2px; border-radius: 6px; background: var(--bg); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.key.new { background: var(--accent-soft); color: var(--accent); }
.key.hot { background: var(--urgent-soft); color: var(--urgent); }
.key.soon { background: var(--warn-soft); color: var(--warn); }
.key.text { font-family: var(--f-body); font-weight: 500; font-size: 12px; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.cat { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; letter-spacing: 0.03em; }
.cat.VC { color: var(--c-vc); background: var(--c-vc-bg); }
.cat.PE { color: var(--c-pe); background: var(--c-pe-bg); }
.cat.IB { color: var(--c-ib); background: var(--c-ib-bg); }
.cat.AM { color: var(--c-am); background: var(--c-am-bg); }
.cat.sec { color: var(--c-sec); background: var(--c-sec-bg); }
.cat.adv { color: var(--c-adv); background: var(--c-adv-bg); }
.cat.acct { color: var(--c-acct); background: var(--c-acct-bg); }
.cat.etc { color: var(--c-etc); background: var(--c-etc-bg); }
.src.official { color: var(--ink); font-weight: 600; }
.also { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.also a { color: var(--muted); }
.also a:hover { color: var(--ink); }
.lvl { font-weight: 600; color: var(--accent); }
.lvl.pt { color: var(--warn); }
.deal { font-size: 11px; font-weight: 600; color: var(--ink); border: 1px solid var(--line); padding: 0 6px; border-radius: 4px; }
.company { font-weight: 600; color: var(--ink); font-size: 13px; }
.side { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.side.hot { color: var(--urgent); font-weight: 600; }
.title { color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.title:hover { text-decoration: underline; text-underline-offset: 3px; }
.title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.apply { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 12px; }
.mailtag { font-size: 11px; font-weight: 600; color: var(--urgent); background: var(--urgent-soft); padding: 2px 8px; border-radius: 99px; }
.email { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 12px; color: var(--ink); }
.email span { user-select: all; overflow-wrap: anywhere; }
.copy { all: unset; cursor: pointer; font-family: var(--f-body); font-size: 11px; color: var(--accent); border: 1px solid var(--accent); padding: 1px 7px; border-radius: 4px; flex: none; }
.copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.site { color: var(--muted); }
.empty { padding: 40px 18px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }
footer { font-size: 12px; color: var(--muted); }

@media (max-width: 720px) {
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .summary button:nth-child(3) { border-left: 0; }
  .summary button:nth-child(n+3) { border-top: 1px solid var(--line); }
  .item { grid-template-columns: 64px minmax(0, 1fr); padding: 12px 14px; gap: 4px 12px; }
  .apply { grid-column: 2; align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
  .row .lab { width: 100%; }
  .tabs { width: 100%; }
  .tabs button { flex: 1; text-align: center; }
}
@media (prefers-reduced-motion: no-preference) {
  .item { transition: background 0.12s; }
  .item:hover { background: var(--bg); }
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>인턴 공고 보드</h1>
      <div class="asof">

  </header>

  <div class="tabbar">

    </div>
    <span class="count" id="count"></span>
  </div>
  <main id="out"></main>

  <footer>같은 공고가 회사 홈페이지와 KKB·금투협 등에 함께 올라오면 홈페이지 공고 하나만 보이고, 나머지는 「같은 공고」 링크로 붙습니다. 제목을 누르면 원문으로 이동합니다. 24시간이 안 된 공고는 올라온 지 몇 시간 됐는지로 표시합니다. 금투협·KKB는 게시 시각, VC협회는 게시판에 시각이 없어 수집 시각 기준(≈)입니다.</footer>

        ${p.front ? `<span class="deal">투자·딜</span>` : ""}
        <span class="company">${esc(p.company)}</span>
        <span>·</span><span class="src${p.official ? " official" : ""}">${esc(p.source_name || p.source)}</span>
        <span>·</span>${side}
      </div>
      <a class="title" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      ${(p.also || []).length ? `<div class="also"><span>같은 공고:</span>${p.also.map(a => `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)}</a>`).join("")}</div>` : ""}
    </div>
    <div class="apply">${apply}</div>
  </article>`;
}

function chipRow(el, items, active, onToggle, counts) {
  el.innerHTML = "";
  for (const [val, label] of items) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed", active(val));
    b.innerHTML = counts ? `${esc(label)}<span class="n">${counts[val] || 0}</span>` : esc(label);
    b.onclick = () => onToggle(val);
    el.appendChild(b);
  }
}
const toggleSet = set => v => { set.has(v) ? set.delete(v) : set.add(v); render(); };

function render() {
  now = Date.now(); today = kstDate(now);
  rows.forEach(derive);
  try { localStorage.setItem("intern-board", JSON.stringify({ period: state.period, sort: state.sort, dealOnly: state.dealOnly })); } catch (e) {}

  const b = base();
  const open = rows.filter(p => !p.closed && (!state.dealOnly || p.front));
  document.getElementById("s-fresh").textContent = open.filter(p => p.fresh).length;
  document.getElementById("s-mail").textContent = open.filter(p => p.apply_method === "email" && inPeriod(p)).length;
  document.getElementById("s-soon").textContent = open.filter(p => (p.dd !== null && p.dd <= 3) || (p.asap && p.dd === null)).length;
  document.getElementById("s-open").textContent = open.length;
  document.querySelectorAll(".summary button").forEach(x => x.setAttribute("aria-pressed", !!x.dataset.quick && x.dataset.quick === state.quick));
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.sort === state.sort));

  const cc = {}, lc = {}, sc = {};
  b.forEach(p => { cc[p.cat] = (cc[p.cat] || 0) + 1; lc[p.level] = (lc[p.level] || 0) + 1; sc[srcGroup(p)] = (sc[srcGroup(p)] || 0) + 1; });
  chipRow(document.getElementById("f-period"), PERIODS, v => state.period === v, v => { state.period = v; render(); });
  chipRow(document.getElementById("f-lvl"), LVL, v => state.lvls.has(v), toggleSet(state.lvls), lc);
  chipRow(document.getElementById("f-cat"), CAT_ORDER.map(c => [c, c]), v => state.cats.has(v), toggleSet(state.cats), cc);
  chipRow(document.getElementById("f-src"), SRC_GROUPS, v => state.srcs.has(v), toggleSet(state.srcs), sc);

  const list = b.filter(p =>
    (!state.cats.size || state.cats.has(p.cat)) &&
    (!state.lvls.size || state.lvls.has(p.level)) &&
    (!state.srcs.size || state.srcs.has(srcGroup(p))) &&
    quickOk(p)
  );
  const out = document.getElementById("out");
  document.getElementById("count").textContent = `공고 ${list.length}건`;
  if (!list.length) {
    out.innerHTML = `<div class="empty">조건에 맞는 공고가 없습니다. 기간을 넓히거나 필터를 해제해 보세요.</div>`;
    return;
  }

  if (state.sort === "due") {
    // ASAP(마감일 없음) → 마감일 가까운 순 → 채용시 마감(최근 등록순) → 마감된 공고
    const rank = p => p.closed ? 3 : (p.asap && p.dd === null) ? 0 : p.dd !== null ? 1 : 2;
    list.sort((a, b) => rank(a) - rank(b) || (a.dd ?? 0) - (b.dd ?? 0) || b.ts - a.ts);
    out.innerHTML = `<div class="list">${list.map(item).join("")}</div>`;
    return;
  }

  list.sort((a, b) => b.ts - a.ts);
  const fresh = list.filter(p => p.fresh);
  const groups = new Map();
  list.filter(p => !p.fresh).forEach(p => { if (!groups.has(p.posted)) groups.set(p.posted, []); groups.get(p.posted).push(p); });
  let html = "";
  if (fresh.length) html += `<section class="day fresh"><h2><span class="d">최근 24시간</span><span>${fresh.length}건 · 빨리 보낼수록 유리</span></h2><div class="list">${fresh.map(item).join("")}</div></section>`;
  for (const [d, ps] of groups) {
    const n = diffDays(today, d);
    const rel = n === 0 ? "오늘" : n === 1 ? "어제" : `${n}일 전`;
    html += `<section class="day"><h2><span class="d">${fmtDay(d)}</span><span>${rel} · ${ps.length}건</span></h2><div class="list">${ps.map(item).join("")}</div></section>`;
  }
  out.innerHTML = html;
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("hide-closed").addEventListener("change", e => { state.hideClosed = e.target.checked; render(); });
document.getElementById("deal-only").checked = state.dealOnly;
document.getElementById("deal-only").addEventListener("change", e => { state.dealOnly = e.target.checked; render(); });
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { state.sort = b.dataset.sort; render(); }));
document.querySelectorAll(".summary button").forEach(b => b.addEventListener("click", () => {
  const q = b.dataset.quick;
  state.quick = q && state.quick !== q ? q : "";
  if (q === "soon") state.sort = "due";
  if (q === "fresh") state.sort = "new";
  render();
}));
document.getElementById("out").addEventListener("click", e => {
  const b = e.target.closest(".copy");
  if (!b) return;
  const done = () => { b.textContent = "복사됨"; setTimeout(() => (b.textContent = "복사"), 1400); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.copy).then(done, fallback); else fallback();
});

const gen = Date.parse(GENERATED_AT);
document.getElementById("asof").textContent = `${fmtDay(kstDate(gen))} ${hhmm(gen)}`;
const lag = (Date.now() - gen) / HOUR;
if (lag > 6) { const st = document.getElementById("stale"); st.hidden = false; st.textContent = `${Math.floor(lag)}시간 동안 갱신 안 됨`; }
render();
setInterval(render, 60000);
</script>
